# Deploy Edge Function meta-webhook ke Supabase setiap ada perubahan di supabase/functions.
# Butuh secret repo GitHub: SUPABASE_ACCESS_TOKEN
#   (Supabase Dashboard → Account → Access Tokens → Generate new token)
name: Deploy Supabase function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hfajdpkirsrewjsouybu
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy meta-webhook
        run: supabase functions deploy meta-webhook --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
